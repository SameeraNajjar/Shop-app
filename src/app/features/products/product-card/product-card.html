<div class="bg-white rounded-2xl shadow hover:shadow-lg transition p-3 flex flex-col relative cursor-pointer"
     (click)="onCardClick()">
  <div class="absolute top-3 left-3 bg-black text-white text-xs font-semibold px-3 py-1 rounded-full">
    {{ product.category }}
  </div>
  <button class="absolute top-3 right-3 bg-white rounded-full p-2 shadow hover:bg-gray-100">
    <i class="bi bi-heart text-gray-700"></i>
  </button>

  <div class="rounded-xl overflow-hidden h-48 w-full">
    <img [src]="product.image" alt="{{product.title}}" class="object-cover w-full h-full">
  </div>

  <div class="mt-4 flex-1">
    <h3 class="font-semibold text-lg leading-tight">{{ product.title }}</h3>
    <div class="flex items-center mt-1 text-yellow-500 text-sm">
      <i class="bi bi-star-fill mr-1"></i>
      <span>{{ product.rating }}</span>
    </div>
  </div>

  <div class="mt-4 flex items-center justify-between">
    <div class="text-xl font-bold">${{ product.price }}</div>
    <button (click)="addToCart($event)"
            class="bg-black text-white p-3 rounded-full hover:bg-gray-800 transition">
      <i class="bi bi-cart"></i>
    </button>
  </div>
</div>
