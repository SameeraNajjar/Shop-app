<div *ngIf="product as p" class="container mx-auto px-6 py-10">

  <!-- Breadcrumb -->
  <div class="text-sm text-gray-500 mb-6">
    <a routerLink="/" class="hover:underline">Home</a> /
    <a routerLink="/{{ p.category | lowercase }}" class="hover:underline">{{ p.category }}</a> /
    <span class="text-gray-800">{{ p.title }}</span>
  </div>

  <div class="flex flex-col lg:flex-row gap-10 bg-white p-8 rounded-2xl shadow-md">
    <!-- Product Image -->
    <div class="flex-1">
      <img [src]="p.image" alt="{{ p.title }}" class="rounded-2xl w-full object-cover">
    </div>

    <!-- Product Details -->
    <div class="flex-1 flex flex-col justify-between">
      
      <!-- Top Info -->
      <div>
        <span class="inline-block bg-black text-white text-xs font-semibold px-3 py-1 rounded-full mb-3">
          {{ p.category }}
        </span>
        <h1 class="text-4xl font-bold mb-3">{{ p.title }}</h1>

        <div class="flex items-center text-yellow-500 mb-2">
          <i class="bi bi-star-fill mr-1"></i>
          <span class="text-gray-800 font-medium">({{ p.rating }}) • 128 reviews</span>
        </div>

        <!-- Price & Discount -->
        <div class="flex items-center gap-3 mb-3">
          <div class="text-3xl font-bold">${{ p.price }}</div>
          <div class="text-gray-400 line-through text-lg">$719.99</div>
        </div>
        <div class="text-green-600 font-semibold mb-5">
          Save $120.00 (20% off)
        </div>

        <!-- Description -->
        <p class="text-gray-700 mb-6 leading-relaxed">
          {{ p.description }}
        </p>

        <!-- Stock & Shipping -->
        <div class="flex items-center gap-2 text-sm mb-8">
          <span class="w-2 h-2 rounded-full" [ngClass]="p.stock! > 0 ? 'bg-green-600' : 'bg-red-600'"></span>
          <span *ngIf="p.stock! > 0" class="text-green-600 font-semibold">In Stock</span>
          <span *ngIf="p.stock === 0" class="text-red-600 font-semibold">Out of Stock</span>
          <span class="text-gray-500">• Free Shipping</span>
        </div>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-3">
          <button
            (click)="addToCart(p)"
            class="flex items-center justify-center gap-2 bg-black text-white py-3 px-6 rounded-lg hover:bg-gray-800 transition text-lg font-semibold">
            <i class="bi bi-cart"></i> Add to Cart
          </button>
          <button
            class="border border-black text-black py-3 px-6 rounded-lg hover:bg-black hover:text-white transition text-lg font-semibold">
            Buy Now
          </button>
        </div>
      </div>

      <!-- Bottom Info Icons -->
      <div class="flex items-center justify-between text-sm text-gray-700 border-t mt-10 pt-5">
        <div class="flex flex-col items-center gap-1">
          <i class="bi bi-truck text-xl"></i>
          <span>Free Shipping</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <i class="bi bi-shield-check text-xl"></i>
          <span>2 Year Warranty</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <i class="bi bi-arrow-repeat text-xl"></i>
          <span>30 Day Returns</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Not Found -->
<div *ngIf="!product" class="text-center text-gray-500 py-20">
  Product not found.
</div>

<!-- related products content -->
<ng-container *ngIf="product && product.category">
  <app-related-products [category]="product.category"></app-related-products>
</ng-container>
