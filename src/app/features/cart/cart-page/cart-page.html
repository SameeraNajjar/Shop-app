<div class="container mx-auto max-w-[1200px] p-8">
  <button class="text-dark mb-3 hover:text-gray-700" (click)="goBackToProducts()">
    ← Back to Shopping
  </button>

  <h1 class="text-[2rem] font-bold mb-8">Shopping Cart</h1>

  <div class="grid grid-cols-[2fr_1fr] gap-8">
    <!-- Left Section -->
    <div class="flex flex-col gap-4">
      <app-cart-item *ngFor="let item of items" [item]="item"></app-cart-item>
    </div>

    <!-- Right Section -->
    <div class="bg-white rounded-[12px] p-6 shadow">
      <h3 class="text-[1.2rem] font-semibold mb-4">Order Summary</h3>
      <hr class="my-2 border-gray-300" />

      <div class="flex justify-between my-2 text-[1rem]">
        <span>Subtotal</span>
        <span>{{ subtotal | currency }}</span>
      </div>

      <div class="flex justify-between my-2 text-[1rem]">
        <span>Shipping</span>
        <span>Free</span>
      </div>

      <div class="flex justify-between my-2 text-[1rem]">
        <span>Tax</span>
        <span>{{ tax | currency }}</span>
      </div>

      <hr class="my-2 border-gray-300" />

      <div class="flex justify-between my-3 text-[1.1rem] font-bold">
        <strong>Total</strong>
        <strong>{{ total | currency }}</strong>
      </div>

      <button
        class="bg-black text-white w-full py-3 rounded-lg mt-3 hover:bg-gray-800 transition"
        (click)="proceedToCheckout()"
      >
        Proceed to Checkout
      </button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <app-checkout-page
    [visible]="showCheckout"
    [items]="items"
    [total]="total"
    (close)="closeCheckout()"
    (confirm)="confirmOrder()"
  ></app-checkout-page>
</div>
